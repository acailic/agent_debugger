name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install SDK + server deps
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install \
            fastapi \
            "uvicorn[standard]" \
            "sqlalchemy[asyncio]" \
            aiosqlite \
            alembic \
            aiofiles \
            bcrypt \
            httpx \
            langchain-core \
            pydantic-ai \
            pytest \
            pytest-asyncio \
            pytest-xdist \
            pytest-timeout \
            ruff

      - name: Lint
        run: ruff check .

      # Advisory only: the codebase carries a known typing-debt baseline
      # (~280 errors, see pyrightconfig.json) that predates CI gating.
      # `--ignoreexternal` used to suppress the exit code; pyright 1.1.411
      # removed that behavior, so the step is continue-on-error instead.
      - name: Type check with pyright (advisory)
        continue-on-error: true
        run: |
          pip install pyright
          pyright

      # Python contract regressions use the TypeScript compiler to parse the client.
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests with coverage
        run: |
          pip install pytest-cov
          python3 -m pytest -q -n auto --timeout=30 --maxfail=5 --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=70 -k "not integration"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test -- --run

      - name: Check API contract sync
        run: python3 scripts/hooks/check_api_contract.py

      - name: Security scan with bandit
        run: |
          pip install bandit
          bandit -r agent_debugger_sdk/ api/ storage/ collector/ auth/ redaction/ -ll -x "*/tests/*" || true  # Don't fail CI initially

  # Real-service run of the Redis buffer tests. The main test job cannot
  # exercise these: test_buffer_redis.py skips without the optional 'redis'
  # pip package, and test_buffer_redis_service.py additionally skips without
  # a 'redis-server' binary on PATH (it spawns its own ephemeral servers).
  # The service container provides a real Redis for REDIS_URL consumers;
  # the apt package provides the binary the service tests require.
  redis-buffer:
    name: Redis buffer (real service)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install redis-server binary
        run: sudo apt-get update && sudo apt-get install -y redis-server

      - name: Install SDK + server deps
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install \
            fastapi \
            "uvicorn[standard]" \
            "sqlalchemy[asyncio]" \
            aiosqlite \
            alembic \
            aiofiles \
            bcrypt \
            httpx \
            pytest \
            pytest-asyncio \
            pytest-timeout \
            redis

      - name: Run redis buffer tests (must not skip)
        env:
          REDIS_URL: redis://localhost:6379
        run: |
          python3 -m pytest -v -ra -o addopts='' tests/test_buffer_redis.py tests/test_buffer_redis_service.py

  dep-check:
    name: Dependency security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Review dependency changes (PRs only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
        continue-on-error: true  # Deprecated action may fail on Node.js 20

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install audit tools
        run: pip install pip-audit

      - name: Audit SDK dependencies
        run: pip-audit --desc --strict -r <(python3 -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print('\n'.join(d['project']['dependencies']))")

      - name: Audit server dependencies
        run: pip-audit --desc --strict -r <(python3 -c "import tomllib; d=tomllib.load(open('pyproject-server.toml','rb')); print('\n'.join(d['project']['dependencies']))")

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high
